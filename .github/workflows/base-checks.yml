name: Lint, format and unit-test checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint with lintr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          # Download pre-compiled versions of dependency packages. This
          # Speeds-up the workflow (compiling from source takes time).
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # To minimize the dependencies to install, we manually ask for just
          # lintr and our own package.
          extra-packages: any::lintr, local::.
          needs: lint
      - name: Run linter
        env:
          LINTR_ERROR_ON_LINT: true
        run: |
          lintr::lint_package()
        shell: Rscript {0}

  format:
    name: Check formatting with styler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::styler, local::.
          needs: styler
      - name: Run styler
        run: |
          styler::style_pkg(strict = TRUE, dry = "fail")
        shell: Rscript {0}

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Installs all packages in the "Suggests" section of DESCRIPTION,
          # as well as our package itself.
          needs: check
      - name: Run tests
        run: |
          testthat::test_local()
        shell: Rscript {0}

  r-cmd-check:
    needs: [lint, format, unit-tests]
    runs-on: ${{ matrix.config.os }}
    name: R CMD check for ${{ matrix.config.os }} R-${{ matrix.config.r }} (check build)
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
